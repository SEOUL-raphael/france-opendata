name: Deploy standalone france-opendata to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "artifacts/france-opendata/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: artifacts/france-opendata
        run: npm install --ignore-scripts

      # Set these in: GitHub repo → Settings → Secrets and variables → Actions → Variables.
      # The static web app only calls the Cloudflare Worker; it does not use
      # Replit services or the repository's other workspace packages.
      #   VITE_WORKER_URL        = https://france-opendata-worker.YOUR_CF_SUBDOMAIN.workers.dev
      #   VITE_GITHUB_PAGES_BASE = /france-opendata/   (must match your repo name)
      - name: Build
        working-directory: artifacts/france-opendata
        run: npm run build
        env:
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
          VITE_GITHUB_PAGES_BASE: ${{ vars.VITE_GITHUB_PAGES_BASE }}
          NODE_ENV: production

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "artifacts/france-opendata/dist/public"

      - id: deployment
        uses: actions/deploy-pages@v4
