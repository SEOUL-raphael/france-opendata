openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for France Open Data Portal explorer
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: Minimax AI chat operations
  - name: datagouv
    description: data.gouv.fr proxy operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /chat/message:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send message to Minimax AI
      description: Send a message to the Minimax AI assistant for data analysis and France-Korea policy comparison
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageRequest"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessageResponse"
        "500":
          description: AI service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /datagouv/datasets:
    get:
      operationId: searchDatasets
      tags: [datagouv]
      summary: Search datasets on data.gouv.fr
      parameters:
        - name: q
          in: query
          description: Search query
          schema:
            type: string
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          description: Results per page
          schema:
            type: integer
            default: 20
        - name: tag
          in: query
          description: Filter by tag
          schema:
            type: string
        - name: organization
          in: query
          description: Filter by organization ID
          schema:
            type: string
        - name: sort
          in: query
          description: Sort order (e.g. -created, title)
          schema:
            type: string
      responses:
        "200":
          description: List of datasets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetListResponse"

  /datagouv/datasets/{id}:
    get:
      operationId: getDataset
      tags: [datagouv]
      summary: Get dataset details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dataset details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "404":
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /datagouv/datasets/{id}/resources:
    get:
      operationId: getDatasetResources
      tags: [datagouv]
      summary: Get resources for a dataset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Dataset resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceListResponse"

  /datagouv/organizations:
    get:
      operationId: searchOrganizations
      tags: [datagouv]
      summary: Search organizations on data.gouv.fr
      parameters:
        - name: q
          in: query
          description: Search query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationListResponse"

  /datagouv/organizations/{id}:
    get:
      operationId: getOrganization
      tags: [datagouv]
      summary: Get organization details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /datagouv/organizations/{id}/datasets:
    get:
      operationId: getOrganizationDatasets
      tags: [datagouv]
      summary: Get datasets from a specific organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Organization datasets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetListResponse"

  /datagouv/dataservices:
    get:
      operationId: searchDataservices
      tags: [datagouv]
      summary: Search data services (APIs) on data.gouv.fr
      parameters:
        - name: q
          in: query
          description: Search query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of data services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataserviceListResponse"

  /datagouv/dataservices/{id}:
    get:
      operationId: getDataservice
      tags: [datagouv]
      summary: Get data service details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dataservice details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataservice"
        "404":
          description: Dataservice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /datagouv/stats:
    get:
      operationId: getPortalStats
      tags: [datagouv]
      summary: Get portal statistics
      description: Returns aggregate stats about the data.gouv.fr portal
      responses:
        "200":
          description: Portal statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required:
        - role
        - content

    ChatMessageRequest:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        context:
          type: ["string", "null"]
          description: Optional context (dataset info, etc.)
      required:
        - messages

    ChatMessageResponse:
      type: object
      properties:
        content:
          type: string
        role:
          type: string
      required:
        - content
        - role

    DatasetOrganization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        logo:
          type: ["string", "null"]
        logo_thumbnail:
          type: ["string", "null"]

    DatasetResource:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        format:
          type: ["string", "null"]
        url:
          type: string
        type:
          type: ["string", "null"]
        filesize:
          type: ["integer", "null"]
        mime:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        created_at:
          type: ["string", "null"]
        last_modified:
          type: ["string", "null"]
      required:
        - id
        - title
        - url

    Dataset:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        created_at:
          type: ["string", "null"]
        last_modified:
          type: ["string", "null"]
        last_update:
          type: ["string", "null"]
        organization:
          nullable: true
          $ref: "#/components/schemas/DatasetOrganization"
        resources:
          type: array
          items:
            $ref: "#/components/schemas/DatasetResource"
        metrics:
          type: object
          properties:
            reuses:
              type: integer
            followers:
              type: integer
            views:
              type: integer
            discussions:
              type: integer
        license:
          type: ["string", "null"]
        frequency:
          type: ["string", "null"]
        temporal_coverage:
          type: ["string", "null"]
        spatial:
          type: ["string", "null"]
      required:
        - id
        - title
        - slug

    DatasetListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Dataset"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        next_page:
          type: ["string", "null"]
        previous_page:
          type: ["string", "null"]
      required:
        - data
        - page
        - page_size
        - total

    ResourceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DatasetResource"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
      required:
        - data
        - page
        - page_size
        - total

    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        logo:
          type: ["string", "null"]
        logo_thumbnail:
          type: ["string", "null"]
        created_at:
          type: ["string", "null"]
        metrics:
          type: object
          properties:
            datasets:
              type: integer
            members:
              type: integer
            views:
              type: integer
            followers:
              type: integer
            reuses:
              type: integer
        members:
          type: array
          items:
            type: object
        url:
          type: ["string", "null"]
      required:
        - id
        - name
        - slug

    OrganizationListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        next_page:
          type: ["string", "null"]
        previous_page:
          type: ["string", "null"]
      required:
        - data
        - page
        - page_size
        - total

    Dataservice:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        base_api_url:
          type: ["string", "null"]
        endpoint_description_url:
          type: ["string", "null"]
        organization:
          nullable: true
          $ref: "#/components/schemas/DatasetOrganization"
        tags:
          type: array
          items:
            type: string
        created_at:
          type: ["string", "null"]
        last_update:
          type: ["string", "null"]
        license:
          type: ["string", "null"]
      required:
        - id
        - title
        - slug

    DataserviceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Dataservice"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        next_page:
          type: ["string", "null"]
        previous_page:
          type: ["string", "null"]
      required:
        - data
        - page
        - page_size
        - total

    PortalStats:
      type: object
      properties:
        datasets:
          type: integer
        resources:
          type: integer
        reuses:
          type: integer
        organizations:
          type: integer
        users:
          type: integer
        dataservices:
          type: integer
      required:
        - datasets
        - resources
        - reuses
        - organizations
        - users
        - dataservices
